<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js?v=2.7.font1").then(function (r) {
      // Si hi ha una versió nova esperant, s'aplica i es recarrega una sola vega.
      r.addEventListener("updatefound", function () {
        var w = r.installing;
        if (!w) return;
        w.addEventListener("statechange", function () {
          if (w.state === "installed" && navigator.serviceWorker.controller) w.postMessage("activa");
        });
      });
      r.update();
    }).catch(function(){});
    var recarregat = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (recarregat) return; recarregat = true; window.location.reload();
    });
  });
}
</script>
